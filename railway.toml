[build]
buildCommand = "uv sync && cd scheduler && go build -o ../go-trader ."

[deploy]
startCommand = "sh -c './go-trader --config scheduler/config.railway.json --status-port ${PORT:-8080}'"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

[[services]]
region = "europe-west4-drams3a"
